name: 🐛 Bug 报告
description: 提交一个可以复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认：
        - 用的是 **Release 里的单文件版**，还是 **源码版**（需要 `assets/` 同目录）？
        - 是否用本地服务器打开（`python -m http.server`）？`file://` 下抠图会降级，属正常现象。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 文件名里的版本号，或源码的 commit
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: 使用形态
      options:
        - 单文件版（dist/ 里的 HTML，图片已内嵌）
        - 源码版（大肥鱼养成计划.html + assets/）
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - Windows 桌面浏览器
        - macOS 桌面浏览器
        - Android 手机
        - iPhone / iPad
        - 其它（请在下方补充）
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: "Chrome 130 / Edge 129 / Safari 17"

  - type: dropdown
    id: mode
    attributes:
      label: 出现位置
      options:
        - 模式一（投喂 / 进化）
        - 模式二（GalGame）
        - 菜单 / 设置 / 成就
        - 存档
        - 加载阶段
        - 全局
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，能稳定复现的 Bug 修得最快
      placeholder: |
        1. 打开游戏，选择模式一
        2. 快速把芯片甩到鲸鱼娘头上并松手
        3. 道具弹回传送带，算力没有增加
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图请直接拖进来；控制台报错（F12）也一并贴出
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 控制台报错、屏幕尺寸、是否开启调试模式（D）等
      render: shell
