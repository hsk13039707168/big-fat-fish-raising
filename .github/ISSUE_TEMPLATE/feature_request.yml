name: ✨ 功能建议
description: 提出一个新玩法、新系统或改进点子
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法！本项目保持**零依赖、单文件可分发**的原则，因此引入第三方库或需要后端的需求大概率不会被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的痛点或想要的体验
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方式
      placeholder: |
        例如：新增「成就解锁时的全屏演出」，在 AchievementSystem.unlock() 后播放 1.5s 动画
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 模式一（投喂 / 进化）
        - 模式二（GalGame）
        - 成就 / 存档
        - 音效 / 视觉
        - 移动端适配
        - 工程 / 文档 / 打包
        - 其它
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: 你愿意参与实现吗
      options:
        - "愿意，我可以提 PR"
        - "愿意，但需要一些指导"
        - "只是提个想法"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考资料
      description: 类似游戏是怎么做的？有参考截图或链接更好
